name: Publish Workers API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version committed in api/package.json on `main` is only a placeholder — it can go
      # stale if a prior run's "Merge to main" step fails after already publishing (as happened
      # before this fix: a publish succeeded but its merge-back never landed, so `main` kept
      # showing an old version and the next run's collision check silently skipped a real
      # release). Git tags are the source of truth for what has actually been published, so the
      # next version is always computed from the latest `jfrog-workers/*` tag on the remote —
      # never from whatever happens to be committed on `main`.
      - name: Compute next version from latest release tag
        working-directory: ./api
        run: |
          LATEST=$(git ls-remote --tags origin 'refs/tags/jfrog-workers/*' \
            | awk '{print $2}' \
            | sed 's#^refs/tags/jfrog-workers/##' \
            | grep -v '\^{}$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No jfrog-workers/* tag found on origin; falling back to the version committed in api/package.json"
            LATEST=$(jq -r '.version' package.json)
          fi
          echo "Latest released version: $LATEST"
          MAJOR=$(echo "$LATEST" | cut -d. -f1)
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
          echo "Computed next version: $NEXT_VERSION"
          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' api/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Check if already released
        id: check
        run: |
          TAG="jfrog-workers/${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag '$TAG' already exists — version ${{ steps.version.outputs.version }} has already been released."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        if: steps.check.outputs.skip != 'true'
        run: git checkout -b "jfrog-workers-${{ steps.version.outputs.version }}"

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Create npmrc
        if: steps.check.outputs.skip != 'true'
        working-directory: ./api
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_EMAIL: npm@jfrog.com
        run: |
          cat > .npmrc << EOF
          always-auth=true
          email=${NPM_EMAIL}
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: ./api
        run: npm install --no-progress

      - name: Commit version bump
        if: steps.check.outputs.skip != 'true'
        run: |
          NEW_VERSION=$(jq -r '.version' api/package.json)
          git add api/package.json
          git add api/package-lock.json 2>/dev/null || true
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"

      - name: Build
        if: steps.check.outputs.skip != 'true'
        working-directory: ./api
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        working-directory: ./api
        run: |
          echo "Publishing API npm package"
          npm publish
          echo "Publishing API npm package done"

      - name: Push release branch
        if: steps.check.outputs.skip != 'true'
        run: git push origin "jfrog-workers-${{ steps.version.outputs.version }}"

      - name: Create and push release tag
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="jfrog-workers/${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"

      - name: Merge to main
        if: steps.check.outputs.skip != 'true'
        run: |
          BRANCH="jfrog-workers-${{ steps.version.outputs.version }}"
          git fetch origin main
          git checkout main
          git merge --no-ff "$BRANCH" -m "chore: merge release ${BRANCH} into main [skip ci]"
          git push origin main
